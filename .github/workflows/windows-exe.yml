name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
        working-directory: windows-app
      - name: Build installer and portable exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
        working-directory: windows-app
      - name: Upload exe files
        uses: actions/upload-artifact@v4
        with:
          name: CineMax-Windows
          path: |
            windows-app/dist/CineMax-Setup.exe
            windows-app/dist/CineMax-Portable.exe
          if-no-files-found: error
          retention-days: 30
