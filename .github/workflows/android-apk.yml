name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      cinemax_url:
        description: HTTPS address of the CineMax site from Render
        required: true
        default: https://cinemax-vlgd.onrender.com/
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Build installable APK
        env:
          CINEMAX_URL: ${{ inputs.cinemax_url }}
        run: gradle --no-daemon :app:assembleDebug "-PcinemaxUrl=$CINEMAX_URL"
        working-directory: android-app
      - name: Make APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineMax-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to a public download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk CineMax.apk
          gh release delete android --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create android CineMax.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "CineMax Android" --notes "APK de CineMax para Android y Android TV"
