name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      cinemax_url:
        description: HTTPS address of the CineMax site from Render
        required: true
        default: https://cinemax-vlgd.onrender.com/
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Build installable APK
        env:
          CINEMAX_URL: ${{ inputs.cinemax_url }}
        run: gradle --no-daemon :app:assembleDebug "-PcinemaxUrl=$CINEMAX_URL"
        working-directory: android-app
      - name: Make APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineMax-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
